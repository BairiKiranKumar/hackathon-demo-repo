name: Dependency Sync Advisor

on:
  pull_request:
    # FIX: No paths filter here — GitHub only checks paths against the NEW push on
    # synchronize events, so PRs with dep-file changes would stop triggering after
    # the first non-dep commit. The Python script handles the "nothing changed" case
    # gracefully (exits 0 with no comment posted/updated).
    types: [opened, synchronize, reopened]

  workflow_dispatch: # Allow the rerun workflow to trigger this
    inputs:
      pr_number:
        description: 'PR number to run against'
        required: true
        type: string

# FIX: Prevent stacked runs when a developer pushes several commits quickly.
# cancel-in-progress kills the queued run so only the latest commit wins.
concurrency:
  group: dep-advisor-pr-${{ github.event.pull_request.number || github.event.inputs.pr_number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  dep-advisor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Use baseRefOid/headRefOid to get actual SHAs, not branch names
      - name: Fetch PR refs if triggered manually
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_JSON=$(gh pr view ${{ github.event.inputs.pr_number }} \
            --json baseRefOid,headRefOid)
          echo "BASE_SHA=$(echo $PR_JSON | jq -r .baseRefOid)" >> $GITHUB_ENV
          echo "HEAD_SHA=$(echo $PR_JSON | jq -r .headRefOid)" >> $GITHUB_ENV

      - name: Run dependency diff advisor
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || env.BASE_SHA }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || env.HEAD_SHA }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
          REPO: ${{ github.repository }}
          STACK_HINT: "RedwoodJS with yarn, Prisma ORM, GraphQL SDL files (*.sdl.ts), PostgreSQL database"
        run: python .github/scripts/dep_advisor.py