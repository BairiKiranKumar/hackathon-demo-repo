name: Dependency Sync Advisor

on:
  pull_request: # Trigger natively on PR updates
    paths:
      - 'requirements.txt'
      - 'package.json'
      - 'alembic.ini'
      - 'docker-compose.yml'
  workflow_dispatch: # Allow the rerun workflow to trigger this
    inputs:
      pr_number:
        description: 'PR number to run against'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  dep-advisor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # If triggered by the other workflow, we need to fetch the branch names dynamically
      - name: Fetch PR refs if triggered manually
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_JSON=$(gh pr view ${{ github.event.inputs.pr_number }} --json baseRefName,headRefName)
          echo "BASE_REF=$(echo $PR_JSON | jq -r .baseRefName)" >> $GITHUB_ENV
          echo "HEAD_REF=$(echo $PR_JSON | jq -r .headRefName)" >> $GITHUB_ENV

      - name: Run dependency diff advisor
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fallback logic depending on if it was a PR event or a workflow_dispatch event
          BASE_SHA: ${{ github.event.pull_request.base.sha || env.BASE_REF }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || env.HEAD_REF }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
          REPO: ${{ github.repository }}
          STACK_HINT: "Node.js with npm, Python with pip, Docker"
        run: python .github/scripts/dep_advisor.py