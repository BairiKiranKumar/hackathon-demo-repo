name: Dependency Sync Advisor

on:
  pull_request: # Trigger natively on PR updates
    paths:
      # JS/TS
      - 'package.json'
      - 'package-lock.json'
      - 'yarn.lock'
      - 'pnpm-lock.yaml'
      - '.nvmrc'
      - '.node-version'
      # Python
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - 'Pipfile'
      - 'Pipfile.lock'
      - 'pyproject.toml'
      - 'poetry.lock'
      - 'setup.py'
      - 'setup.cfg'
      # Ruby
      - 'Gemfile'
      - 'Gemfile.lock'
      # Dart/Flutter
      - 'pubspec.yaml'
      - 'pubspec.lock'
      # Java/Kotlin
      - 'build.gradle'
      - 'build.gradle.kts'
      - 'pom.xml'
      - 'gradle.properties'
      # Docker / infra
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'docker-compose.yaml'
      - 'docker-compose.override.yml'
      # Environment / config
      - '.env.example'
      - '.env.sample'
      - '.env.template'
      # DB / migrations
      - 'alembic.ini'
      - 'MIGRATION_NOTES.md'
      # Native / system
      - 'apt-requirements.txt'
      - 'brew-requirements.txt'

  workflow_dispatch: # Allow the rerun workflow to trigger this
    inputs:
      pr_number:
        description: 'PR number to run against'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  dep-advisor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # FIX: Use baseRefOid/headRefOid to get actual SHAs, not branch names
      - name: Fetch PR refs if triggered manually
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_JSON=$(gh pr view ${{ github.event.inputs.pr_number }} \
            --json baseRefOid,headRefOid)
          echo "BASE_SHA=$(echo $PR_JSON | jq -r .baseRefOid)" >> $GITHUB_ENV
          echo "HEAD_SHA=$(echo $PR_JSON | jq -r .headRefOid)" >> $GITHUB_ENV

      - name: Run dependency diff advisor
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # FIX: env.BASE_SHA / env.HEAD_SHA now carry real SHAs (set in step above)
          BASE_SHA: ${{ github.event.pull_request.base.sha || env.BASE_SHA }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || env.HEAD_SHA }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
          REPO: ${{ github.repository }}
          STACK_HINT: "Node.js with npm, Python with pip, Docker"
        run: python .github/scripts/dep_advisor.py